sonar.projectKey=dsn-lai
sonar.projectName=DSN Legal AI, Legal Operations Platform
sonar.projectVersion=0.1.0

sonar.sources=apps/api/app,apps/web/src
sonar.tests=apps/api/tests
sonar.exclusions=**/node_modules/**,**/.next/**,**/.venv/**,**/__pycache__/**,**/alembic/versions/**,_design_ref/**,apps/api/app/seed.py
sonar.test.exclusions=**/node_modules/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=apps/api/coverage.xml

sonar.sourceEncoding=UTF-8

# The declarative mapping repeats SQLAlchemy's own vocabulary: "SET NULL" on a
# foreign key, "app_user.id" as a target, "all, delete-orphan" as a cascade.
# Replacing those with constants makes a model harder to read, not easier, so
# the duplicate-literal rule is scoped away from the mapping layer only.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=apps/api/app/db/models/**
