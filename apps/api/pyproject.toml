[project]
name = "dsn-lai-api"
version = "0.1.0"
description = "Legal Operations Platform API, DSN and EqualyzAI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "minio>=7.2",
    "python-docx>=1.1",
    "docxtpl>=0.19",
    "openai>=1.60",
    "pgvector>=0.3.6",
    # Pure Python, no transitive dependencies. The enrolment QR is drawn on
    # the server so the secret is encoded once, by the same code that issued it.
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py", "alembic/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
