name: dsn-lai

services:
  db:
    restart: unless-stopped
    # PostgreSQL 18 with pgvector, per PRD section 10.1. One database holds
    # records and embeddings, which keeps permission filtering in one place.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dsn_lai}
      POSTGRES_USER: ${POSTGRES_USER:-dsnlai_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dsnlai_owner_dev_password}
    ports:
      - "${DSNLAI_DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images place the cluster in a subdirectory of this path,
      # so the mount sits one level above the old data directory.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsnlai_owner} -d ${POSTGRES_DB:-dsn_lai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${DSNLAI_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    image: dsn-lai-api:latest
    build:
      context: ./apps/api
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      DSNLAI_STORAGE_BACKEND: ${DSNLAI_STORAGE_BACKEND:-local}
      DSNLAI_STORAGE_PATH: /var/lib/dsn-lai/storage
      # By service name from inside the network. The .env value is the
      # published port, which is what the host process needs and what a
      # container would fail to resolve.
      OPENSIGN_BASE_URL: http://opensign:8080/app
    ports:
      - "${DSNLAI_API_PORT:-8000}:8000"
    volumes:
      # The local backend's documents. Unused when DSNLAI_STORAGE_BACKEND is
      # azure, and harmless there. Signed agreements live here otherwise, so
      # it is never removed with the containers.
      - document_store:/var/lib/dsn-lai/storage
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      opensign: {condition: service_started}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    restart: unless-stopped
    image: dsn-lai-api:latest
    build:
      context: ./apps/api
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      DSNLAI_STORAGE_BACKEND: ${DSNLAI_STORAGE_BACKEND:-local}
      DSNLAI_STORAGE_PATH: /var/lib/dsn-lai/storage
      OPENSIGN_BASE_URL: http://opensign:8080/app
    volumes:
      - document_store:/var/lib/dsn-lai/storage
    depends_on:
      api: {condition: service_healthy}
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--beat", "--loglevel=info"]
    # The image healthcheck probes the HTTP port, which this container does not
    # serve. A worker is healthy when the broker answers it.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -t 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      start_period: 40s
      retries: 5

  web:
    restart: unless-stopped
    image: dsn-lai-web:latest
    build:
      context: ./apps/web
      args:
        # The browser resolves this address, not the container, so it must be
        # reachable from wherever the browser runs.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${DSNLAI_WEB_PORT:-3000}:3000"
    depends_on:
      api: {condition: service_healthy}

  opensign-mongo:
    restart: unless-stopped
    # OpenSign is Parse Server on Mongo. The platform's own records stay in
    # Postgres; this holds the signature service's state and nothing else.
    image: mongo:7
    command: ["--quiet", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - opensign_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20

  opensign:
    restart: unless-stopped
    # Signature, self-hosted and unrestricted.
    #
    # DocuSeal was here first and could not do the job in its free edition:
    # every route that accepts a document, from PDF, DOCX or HTML, answers 404
    # with a link to its pricing page, and its Alpine image ships no converter.
    # OpenSign is AGPL-3.0 with no feature gate in the self-hosted build, and
    # carries LibreOffice, so the .docx the platform renders becomes the PDF
    # the counterparty signs. That matters more than convenience: the PDF
    # derives from the same blocks the content hash was computed over, so what
    # is signed is what was approved.
    image: opensign/opensignserver:main
    environment:
      NODE_ENV: production
      APP_ID: ${OPENSIGN_APP_ID:-opensign}
      appName: open_sign_server
      MASTER_KEY: ${OPENSIGN_MASTER_KEY:-change-me-in-every-environment}
      MONGODB_URI: mongodb://opensign-mongo:27017/opensign
      PARSE_MOUNT: /app
      # Where OpenSign believes it lives. A signer opens the link in a browser
      # on the host, so it is the published address rather than the service
      # name, even though the platform calls it by service name.
      SERVER_URL: http://localhost:${DSNLAI_OPENSIGN_PORT:-8080}/app
      PUBLIC_URL: http://localhost:${DSNLAI_OPENSIGN_CLIENT_PORT:-3200}
      # The certificate embedded into a signed PDF. Unset, the Finish button
      # throws Buffer.from(undefined) after somebody has already drawn their
      # signature, which reads as the signature failing rather than as the
      # deployment missing a certificate.
      PFX_BASE64: ${OPENSIGN_PFX_BASE64:-}
      PASS_PHRASE: ${OPENSIGN_PFX_PASSPHRASE:-}
      SMTP_ENABLE: ${OPENSIGN_SMTP_ENABLE:-true}
      SMTP_HOST: ${OPENSIGN_SMTP_HOST:-mail}
      SMTP_PORT: ${OPENSIGN_SMTP_PORT:-1025}
      SMTP_USER_EMAIL: ${OPENSIGN_SMTP_USER:-signatures@dsn.example}
      SMTP_PASS: ${OPENSIGN_SMTP_PASS:-anything}
    ports:
      - "${DSNLAI_OPENSIGN_PORT:-8080}:8080"
    volumes:
      - opensign_files:/usr/src/app/files
    depends_on:
      opensign-mongo: {condition: service_healthy}
      mail: {condition: service_healthy}

  mail:
    # A mailbox that goes nowhere. The signing service emails each signer a
    # link, and in development those addresses are made up, so a real sender
    # would either bounce or, worse, reach somebody. Everything lands here and
    # is read in a browser instead.
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${DSNLAI_MAIL_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensign-client:
    restart: unless-stopped
    # The signing surface a counterparty opens. The platform never renders it;
    # it hands over a link.
    image: opensign/opensign:main
    environment:
      REACT_APP_SERVERURL: http://localhost:${DSNLAI_OPENSIGN_PORT:-8080}/app
      REACT_APP_APPID: ${OPENSIGN_APP_ID:-opensign}
      PUBLIC_URL: http://localhost:${DSNLAI_OPENSIGN_CLIENT_PORT:-3200}
      GENERATE_SOURCEMAP: "false"
    ports:
      - "${DSNLAI_OPENSIGN_CLIENT_PORT:-3200}:3000"
    depends_on:
      - opensign

  n8n:
    restart: unless-stopped
    # Plumbing, not the platform. n8n polls approved mailboxes, fans out
    # notifications, writes calendar events and moves files. Legal decision
    # logic, tier assignment, approval routing, model calls and direct database
    # writes are all out of bounds for it (PRD section 11.3).
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${DSNLAI_N8N_PORT:-5678}/
      GENERIC_TIMEZONE: Africa/Lagos
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-in-every-environment}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-change-me-in-every-environment}
      # The only address n8n needs. It calls the platform API and nothing else.
      DSNLAI_API_BASE_URL: http://api:8000
      DSNLAI_WEBHOOK_SECRET: ${DSNLAI_SECRET_KEY:-change-me-in-every-environment}
      # One mailbox per organisation, each read by its own workflow: the
      # Outlook ones read DSN_LEGAL_MAILBOX, the Gmail ones EAI_LEGAL_MAILBOX.
      # n8n has no env_file, so a variable not named here never reaches it.
      # Each address has to be on the approved list under its own entity or
      # every message is refused: python -m app.mailbox is how it gets there.
      DSN_LEGAL_MAILBOX: ${DSN_LEGAL_MAILBOX:-}
      EAI_LEGAL_MAILBOX: ${EAI_LEGAL_MAILBOX:-}
      # How the Gmail workflow walks the mailbox: from EAI_MAIL_SINCE
      # (YYYY-MM-DD, a year back when unset) forwards in windows of this many
      # days, then re-reading the last few days on every pass so read state
      # and labels stay current.
      EAI_MAIL_SINCE: ${EAI_MAIL_SINCE:-}
      EAI_MAIL_WINDOW_DAYS: ${EAI_MAIL_WINDOW_DAYS:-7}
      EAI_MAIL_REFRESH_DAYS: ${EAI_MAIL_REFRESH_DAYS:-3}
      # The shaping step and the signing step both read $$env. Newer n8n blocks
      # that in Code nodes by default, and the failure is a signature that does
      # not verify rather than an error naming the cause.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # The signing step needs node's crypto. Code nodes run in an isolated VM
      # with no built-ins at all unless they are named here, and the refusal is
      # "Module 'crypto' is disallowed".
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    ports:
      - "${DSNLAI_N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./integrations/n8n:/workflows:ro
    depends_on:
      api: {condition: service_healthy}

volumes:
  db_data:
  redis_data:
  document_store:
  opensign_mongo:
  opensign_files:
  n8n_data:
