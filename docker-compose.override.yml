# Development only. Compose loads this automatically alongside
# docker-compose.yml, and it is what lets a code change show up without a
# rebuild. Delete it, or run with `-f docker-compose.yml` alone, to get the
# production shape back.
#
# Only the source directories are mounted. The virtual environment, the
# installed package metadata and everything else stay as the image built them.

services:
  api:
    volumes:
      - ./apps/api/app:/srv/app
      - ./apps/api/alembic:/srv/alembic
    command: >
      sh -c "alembic upgrade head && python -m app.seed --if-empty &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
             --reload-dir /srv/app"

  worker:
    volumes:
      - ./apps/api/app:/srv/app
      - ./apps/api/alembic:/srv/alembic

  # n8n calls the platform API. In the built stack that is the `api` container
  # on the compose network; during local development the API runs on the host
  # with reload, the container is not up, and `http://api:8000` resolves to
  # nothing. Pointing it at the host gateway is what lets a workflow be built
  # against the API that is actually running.
  #
  # `--no-deps` is how this one starts while the api container is down:
  #   docker compose up -d --no-deps n8n
  n8n:
    environment:
      DSNLAI_API_BASE_URL: http://host.docker.internal:8000
      # Debug while the mail connector is being brought up. The IMAP node says
      # nothing at info level, so a poll that finds nothing and a poll that
      # never happened look identical from outside.
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-debug}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !reset []
