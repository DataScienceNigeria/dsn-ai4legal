server {
    listen 80;
    listen [::]:80;
    server_name legal.dsnsandbox.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The platform accepts uploads up to DSNLAI_MAX_UPLOAD_MB, 50 by default.
    # nginx defaults to 1 MB, so without this an ordinary signed agreement is
    # refused by the proxy with a 413 the interface never sees and cannot
    # explain.
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        # An upload is read from the client before it is passed on, and a large
        # one over a slow line takes longer than the default 60 seconds.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
