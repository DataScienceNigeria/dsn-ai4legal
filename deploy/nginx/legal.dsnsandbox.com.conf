# Sign-in attempts per client address. The API locks an account after repeated
# failures; this stops one address walking many accounts. limit_req_zone has to
# sit at http level, which is where a file in sites-enabled is included.
limit_req_zone $binary_remote_addr zone=dsnlai_sign_in:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name legal.dsnsandbox.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The platform accepts uploads up to DSNLAI_MAX_UPLOAD_MB, 50 by default.
    # nginx defaults to 1 MB, so without this an ordinary signed agreement is
    # refused by the proxy with a 413 the interface never sees and cannot
    # explain.
    client_max_body_size 64m;

    # Security headers, on every response including errors. HSTS only takes
    # effect over HTTPS, which certbot adds to this block. The enforced policy
    # is the part that cannot break anything: framing only by this origin
    # (OpenSign's screens are proxied here and framed same-origin), no plugins,
    # no base rewriting. The full policy is report-only until the browser
    # console has been checked against it with signing switched on; tighten it
    # then and move it to the enforced header.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # The token endpoint, rate limited. A short burst covers a mistyped
    # password or a second-factor prompt; anything faster gets 429.
    location = /api/v1/auth/token {
        limit_req zone=dsnlai_sign_in burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        # An upload is read from the client before it is passed on, and a large
        # one over a slow line takes longer than the default 60 seconds.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
