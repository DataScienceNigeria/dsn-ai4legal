# Production overlay. Run it explicitly, which also leaves the development
# override out:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# The only thing it changes is where the images come from. They are built in
# GitHub Actions and pulled here, so the server needs no toolchain, no source
# and no build: a deploy is a pull and a restart.
#
# IMAGE_TAG is written by the workflow and pins both images to one commit, so a
# rollback is that variable set to an earlier tag.

services:
  api:
    image: ghcr.io/datasciencenigeria/dsn-ai4legal-api:${IMAGE_TAG:-latest}
    build: !reset null

  worker:
    image: ghcr.io/datasciencenigeria/dsn-ai4legal-api:${IMAGE_TAG:-latest}
    build: !reset null

  web:
    image: ghcr.io/datasciencenigeria/dsn-ai4legal-web:${IMAGE_TAG:-latest}
    build: !reset null

  # Mailpit is a mailbox that goes nowhere, which is the right answer in
  # development and the wrong one here: signature links are emailed to people
  # outside the organisation. Production points OpenSign at a real relay
  # through OPENSIGN_SMTP_HOST, so this never starts and OpenSign no longer
  # waits on it.
  mail:
    profiles: ["never"]

  opensign:
    depends_on: !override
      opensign-mongo: {condition: service_healthy}

  # n8n holds the mailbox credential and can call the platform API, so it is
  # not published to the internet. Bound to the loopback, it is reached by an
  # SSH tunnel from whoever is editing a workflow:
  #
  #   ssh -L 15678:127.0.0.1:5678 azureuser@<server>
  #
  # That address is also what the Microsoft sign-in comes back to, so
  # http://localhost:15678/rest/oauth2-credential/callback is the redirect URI
  # registered on the Entra application and nothing else has to be exposed.
  n8n:
    ports: !override
      - "127.0.0.1:${DSNLAI_N8N_PORT:-5678}:5678"
    environment:
      # The address the editor is opened at, which is the tunnel's local end,
      # not the server. n8n builds every OAuth redirect from it, so it has to
      # match the redirect URI registered at Google or Microsoft exactly: a
      # tunnel on 15678 with this left at 5678 signs in and then sends the
      # browser to a port nothing is listening on.
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_URL:-http://localhost:5678/}
      WEBHOOK_URL: ${N8N_EDITOR_URL:-http://localhost:5678/}
      # Refused rather than defaulted. n8n writes the first key it sees into
      # its volume and will not start under any other, so a deployment that
      # came up once on the placeholder is locked to a key that is in the
      # repository.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_LOG_LEVEL: info
